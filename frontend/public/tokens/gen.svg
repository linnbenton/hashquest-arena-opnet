<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c6"></stop>
      <stop offset="60%" stop-color="#facc15"></stop>
      <stop offset="100%" stop-color="#b45309"></stop>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- coin -->
  <circle cx="64" cy="64" r="54" fill="url(#g)" filter="url(#glow)"></circle>

  <!-- border -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#fde047" stroke-width="3"></circle>

  <!-- text GEN -->
  <text x="50%" y="55%" text-anchor="middle" font-size="28" font-weight="bold" fill="#111">
    GEN
  </text>
</svg>